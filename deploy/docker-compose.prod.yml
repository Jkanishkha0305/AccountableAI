services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      FEED_HOST: 0.0.0.0
      PORT: "8765"
      FEED_BUDGET: "0.25"
    # secrets live only on the server, never in git: see deploy/README.md
    env_file:
      - path: ../.env.prod
        required: false
    expose:
      - "8765"

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        FEED_URL: http://app:8765
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. app.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
